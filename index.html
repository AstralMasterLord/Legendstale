<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Legendstale</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
    }

    .section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
      border-bottom: 1px solid #222;
    }

    h1 {
      font-size: 60px;
      letter-spacing: 5px;
      text-shadow: 0 0 10px white;
    }

    p {
      opacity: 0.8;
      font-size: 18px;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
    }

    img {
      width: 250px;
      margin: 10px;
      border: 2px solid white;
      border-radius: 6px;
      transition: 0.3s;
    }

    img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px white;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: 2px solid white;
      background: transparent;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: white;
      color: black;
    }

    html {
      scroll-behavior: smooth;
    }
  </style>
</head>

<body>

  <!-- PORTADA -->
  <div class="section">
    <h1>LEGENDSTALE</h1>
    <p>Una nueva historia comienza...</p>
    <p><strong>Juego en desarrollo</strong></p>

    <a href="#imagenes">
      <button>Bajar</button>
    </a>
  </div>

  <!-- GALERÍA -->
  <div class="section" id="imagenes">
    <h1>Assets del juego</h1>

    <div class="gallery">

      <img src="39fe564c243982b66fc5e05445f05e26.png">

      <img src="DIVINERUNE.png">
      <img src="DIVINERUNE-1.png">

      <!-- GIFS (IMPORTANTE: con %20 por los espacios) -->
      <img src="dp-gifexport.gif">
      <img src="dp-gifexport%20(1).gif">
      <img src="dp-gifexport%20(2).gif">
      <img src="dp-gifexport%20(3).gif">

    </div>
  </div>

  <!-- FINAL -->
  <div class="section">
    <h1>CONTINUARÁ...</h1>
    <p>Proyecto en desarrollo</p>
  </div>

</body>
</html>
