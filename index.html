<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Legendstale</title>

  <style>
    body {
      margin: 0;
      background: radial-gradient(circle, #111 20%, #000 100%);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      padding-top: 50px;
    }

    h1 {
      font-size: 50px;
      letter-spacing: 5px;
      text-shadow: 0 0 10px white;
    }

    p {
      opacity: 0.85;
      font-size: 18px;
    }

    .images {
      margin-top: 30px;
    }

    img {
      width: 180px;
      margin: 10px;
      border: 2px solid white;
      border-radius: 8px;
      transition: 0.3s;
    }

    img:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px white;
    }

    button {
      margin-top: 30px;
      background: transparent;
      border: 2px solid white;
      color: white;
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: white;
      color: black;
    }

    /* pantalla de inicio */
    .screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <!-- PANTALLA PRINCIPAL -->
  <div id="main" class="screen">

    <h1>LEGENDSTALE</h1>

    <p>Una nueva historia comienza...</p>
    <p><strong>Juego en desarrollo</strong></p>

    <div class="images">
      <img src="img1.png" alt="imagen 1">
      <img src="img2.png" alt="imagen 2">
    </div>

    <button onclick="startGame()">
      Entrar
    </button>

  </div>

  <!-- PANTALLA DEL JUEGO -->
  <div id="game" class="screen hidden">

    <h1>Bienvenido</h1>
    <p>El mundo de Legendstale está en construcción...</p>

    <button onclick="back()">
      Volver
    </button>

  </div>

  <script>
    function startGame() {
      document.getElementById("main").classList.add("hidden");
      document.getElementById("game").classList.remove("hidden");
    }

    function back() {
      document.getElementById("game").classList.add("hidden");
      document.getElementById("main").classList.remove("hidden");
    }
  </script>

</body>
</html>
